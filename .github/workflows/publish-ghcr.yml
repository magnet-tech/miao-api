name: Publish GHCR image (amd64)

# Manual only: builds the checked-out branch for linux/amd64 and pushes it to
# ghcr.io/<owner>/<repo>. The main branch also gets the latest tag.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & push linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve image name and version
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::12}"
          BRANCH="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          VERSION="$BRANCH-$SHORT_SHA"
          echo "$VERSION" > VERSION
          {
            echo "name=$IMAGE"
            echo "version=$VERSION"
            echo "tags<<IMAGE_TAGS"
            echo "$IMAGE:sha-$SHORT_SHA"
            echo "$IMAGE:$BRANCH"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "$IMAGE:latest"
            fi
            echo "IMAGE_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=ghcr-amd64
          cache-to: type=gha,scope=ghcr-amd64,mode=max

      - name: Image summary
        env:
          TAGS: ${{ steps.image.outputs.tags }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published linux/amd64 image"
            echo '```'
            echo "$TAGS"
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
